name: Build FUR-602 ImmortalWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          python3 \
          rsync \
          unzip \
          zlib1g-dev \
          file


    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          dl
          ~/.ccache
        key: immortalwrt-${{ github.sha }}
        restore-keys: |
          immortalwrt-


    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a


    - name: Load config
      run: |
        cp .config.example .config
        make defconfig


    - name: Download packages
      run: |
        make download -j8


    - name: Compile
      run: |
        make -j$(nproc) V=s


    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: FUR-602-firmware
        path: |
          bin/targets/mediatek/filogic/*
